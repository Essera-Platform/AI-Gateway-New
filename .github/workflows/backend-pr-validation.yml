name: Backend PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: false
          tags: essera-ai-gateway-backend:validation
          build-args: APP_VERSION=validation-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  openapi-lint:
    name: API docs lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Lint the customer API's OpenAPI document
        env:
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: npx --yes @redocly/cli@2.76.0 lint --config essera/apidocs/redocly.yaml essera/apidocs/openapi.yaml

  go-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: essera
          POSTGRES_PASSWORD: essera
          POSTGRES_DB: essera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U essera" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Placeholder UI for the embedded build
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Essera integration on PostgreSQL
        env:
          ESSERA_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=essera password=essera dbname=essera sslmode=disable
        run: go test ./essera/...
      - name: Packages the integration hooks into
        run: go test ./middleware/... ./model/... ./controller/... ./router/... ./dto/... ./relay/... ./service/...
