# Lint rules for openapi.yaml: every recommended rule as an error, except two that the
# document breaks on purpose: its server is a placeholder the Gateway replaces with its own
# address when it serves the document, and the API has no license of its own. The Realtime
# WebSocket answers 101 Switching Protocols, never a 2XX; .redocly.lint-ignore.yaml exempts
# that one operation.
extends:
  - recommended-strict
rules:
  info-license: off
  no-server-example.com: off
