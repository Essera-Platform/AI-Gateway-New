# Lint rules for openapi.yaml: every recommended rule as an error, except three that the
# document breaks on purpose. Its server is a placeholder the Gateway replaces with its own
# address when it serves the document, the API has no license of its own, and the Realtime
# WebSocket answers 101 Switching Protocols, never a 2XX.
extends:
  - recommended-strict
rules:
  info-license: off
  no-server-example.com: off
  operation-2xx-response: off
