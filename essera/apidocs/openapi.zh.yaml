    对话补全。设置 `"stream": true` 时，改为返回服务器发送事件流，每行 `data:` 包含
    一个 `chat.completion.chunk`，最后是 `data: [DONE]`。
- en: "Server-sent events, each `data:` line a `chat.completion.chunk`, ending with `data: [DONE]`."
  zh: "服务器发送事件（SSE），每行 `data:` 为一个 `chat.completion.chunk`，以 `data: [DONE]` 结束。"
- en: "Create a response"
  zh: "创建响应"
- en: |
    Generates a response in the OpenAI Responses format, with any text model of your account. The Gateway does
    not store responses: send the whole conversation in `input` each time. With `"stream": true` the answer comes
    as server-sent Responses events (`response.output_text.delta`, …, `response.completed`).
  zh: |
    以 OpenAI Responses 格式，使用您账户中的任意文本模型生成响应。网关不存储响应：
    每次都需在 `input` 中发送完整对话。设置 `"stream": true` 时，回答以 Responses 服务器发送事件返回
    （`response.output_text.delta`、…、`response.completed`）。
- en: "The response. With `\"stream\": true`, a stream of server-sent Responses events instead."
  zh: "响应。设置 `\"stream\": true` 时，改为返回 Responses 服务器发送事件流。"
- en: "Server-sent Responses events, ending with `response.completed`."
  zh: "Responses 服务器发送事件，以 `response.completed` 结束。"
- en: "Create a message (Anthropic format)"
  zh: "创建消息（Anthropic 格式）"
- en: |
    Generates the next message in the Anthropic Messages format, with any text model of your account, Claude or
    not. The key may come as `x-api-key`, as the Anthropic SDK sends it, or as `Authorization: Bearer`.
    `max_tokens` is required by this format; Nova 2 at high reasoning effort does not accept it, so use medium
    effort with Nova 2 here, or `/v1/chat/completions` without a token cap.

    With `"stream": true` the answer comes as Anthropic server-sent events (`message_start`,
    `content_block_delta`, …, `message_stop`).
  zh: |
    以 Anthropic Messages 格式，使用您账户中的任意文本模型（无论是否为 Claude）生成下一条消息。
    密钥可以通过 `x-api-key`（Anthropic SDK 的发送方式）或 `Authorization: Bearer` 传递。
    该格式要求提供 `max_tokens`；高推理强度下的 Nova 2 不接受该参数，因此在此端点使用 Nova 2 时请选择中等推理强度，
    或改用不设 Token 上限的 `/v1/chat/completions`。

    设置 `"stream": true` 时，回答以 Anthropic 服务器发送事件返回（`message_start`、
    `content_block_delta`、…、`message_stop`）。
- en: "The Anthropic API version your client speaks. The Anthropic SDKs send it; the Gateway accepts it."
  zh: "您的客户端使用的 Anthropic API 版本。Anthropic SDK 会发送该请求头，网关接受它。"
- en: "The message. With `\"stream\": true`, a stream of Anthropic server-sent events instead."
  zh: "消息。设置 `\"stream\": true` 时，改为返回 Anthropic 服务器发送事件流。"
- en: "Anthropic server-sent events, ending with `message_stop`."
  zh: "Anthropic 服务器发送事件，以 `message_stop` 结束。"
- en: "Create embeddings"
  zh: "创建嵌入"
- en: |
    Turns text into vectors with an embedding model of your account: Titan Text Embeddings v2, Titan Multimodal
    Embeddings, or Cohere Embed v3 and v4. `input` takes one string or up to 256. On Titan Multimodal Embeddings
    and Cohere Embed, an input may also be an image as a base64 data URL.
  zh: |
    使用您账户中的嵌入模型将文本转换为向量：Titan Text Embeddings v2、Titan Multimodal
    Embeddings，或 Cohere Embed v3 和 v4。`input` 接受一个字符串或最多 256 个。在 Titan Multimodal Embeddings
    和 Cohere Embed 上，输入也可以是以 base64 data URL 表示的图像。
- en: "One embedding per input, in the order of the inputs."
  zh: "每个输入对应一个嵌入，顺序与输入一致。"
- en: "An API key from the API Keys page, as `Authorization: Bearer sk-…`."
  zh: "来自 API 密钥页面的 API 密钥，格式为 `Authorization: Bearer sk-…`。"
- en: "The same API key in the `x-api-key` header, as the Anthropic SDK sends it. Accepted on `/v1/messages` and `/v1/models`."
  zh: "放在 `x-api-key` 请求头中的同一 API 密钥，与 Anthropic SDK 的发送方式一致。适用于 `/v1/messages` 和 `/v1/models`。"
- en: "The request is not valid for the model."
  zh: "请求对该模型无效。"
- en: "A request Bedrock refuses"
  zh: "被 Bedrock 拒绝的请求"
- en: "Nova 2 at high effort with max_tokens"
  zh: "高推理强度的 Nova 2 携带 max_tokens"
- en: "The request is not valid for the model, in the Anthropic error format."
  zh: "请求对该模型无效，以 Anthropic 错误格式返回。"
- en: "The API key is missing, not valid, expired or deleted."
  zh: "API 密钥缺失、无效、已过期或已删除。"
- en: "Not a valid key"
  zh: "无效的密钥"
- en: "An expired key"
  zh: "已过期的密钥"
- en: "The account may not make this request."
  zh: "该账户无权发出此请求。"
- en: "A model the account may not use"
  zh: "账户无权使用的模型"
- en: "A suspended account"
  zh: "已暂停的账户"
- en: "A country the account is not served in"
  zh: "账户不提供服务的国家/地区"
- en: "A country that could not be told"
  zh: "无法判断的国家/地区"
- en: "The request body is larger than the Gateway accepts."
  zh: "请求体超出网关接受的大小。"
- en: "A monthly limit of the account is reached, or the model's rate per minute."
  zh: "已达到账户的某项月度限额，或模型的每分钟速率限制。"
- en: "A monthly limit"
  zh: "月度限额"
- en: "The model's rate per minute"
  zh: "模型的每分钟速率"
- en: "The Gateway is in maintenance or cannot serve the request right now."
  zh: "网关正在维护，或暂时无法处理该请求。"
- en: "Seconds until the end of the maintenance, when it is known."
  zh: "距维护结束的秒数（若已知）。"
- en: "Maintenance"
  zh: "维护"
- en: "The Gateway cannot check the request"
  zh: "网关无法检查该请求"
- en: "What went wrong, ending with the request id."
  zh: "出错原因，末尾附有请求 ID。"
- en: "A stable code to act on; see Errors in the introduction."
  zh: "可据以处理的稳定错误代码；参见简介中的“错误”一节。"
- en: "The catalog id to send as `model`."
  zh: "作为 `model` 发送的目录 ID。"
- en: "The request formats the model is listed for."
  zh: "该模型所支持的请求格式。"
- en: "The image as a base64 data URL, `data:image/png;base64,…` (PNG, JPEG, GIF or WebP)."
  zh: "以 base64 data URL 表示的图像，`data:image/png;base64,…`（PNG、JPEG、GIF 或 WebP）。"
- en: "A document, on models that read documents."
  zh: "文档，适用于能读取文档的模型。"
- en: "The document as a base64 data URL (PDF, CSV, TXT, MD, HTML, DOC, DOCX, XLS, XLSX)."
  zh: "以 base64 data URL 表示的文档（PDF、CSV、TXT、MD、HTML、DOC、DOCX、XLS、XLSX）。"
- en: "Audio to understand, on models that hear (Voxtral)."
  zh: "供模型理解的音频，适用于能处理音频的模型（Voxtral）。"
- en: "Base64 audio."
  zh: "Base64 编码的音频。"
- en: "The arguments as a JSON string."
  zh: "以 JSON 字符串表示的参数。"
- en: "Text, or for a user message a list of parts. May be null on an assistant message with tool calls."
  zh: "文本；对于用户消息，也可以是内容片段列表。带有工具调用的助手消息中可以为 null。"
- en: "On an assistant message, the tool calls it made."
  zh: "助手消息中发起的工具调用。"
- en: "On a tool message, the id of the call it answers."
  zh: "工具消息所响应的调用 ID。"
- en: "A JSON Schema of the arguments."
  zh: "参数的 JSON Schema。"
- en: "A catalog id from the Model Square or `GET /v1/models`."
  zh: "来自模型广场或 `GET /v1/models` 的目录 ID。"
- en: "The most tokens to generate."
  zh: "最多生成的 Token 数。"
- en: "The same as `max_tokens`."
  zh: "与 `max_tokens` 相同。"
- en: "Up to four sequences that end the answer."
  zh: "最多四个用于结束回答的序列。"
- en: "Send the answer as server-sent events."
  zh: "以服务器发送事件（SSE）的形式返回回答。"
- en: "Add a last chunk with the token usage."
  zh: "在最后追加一个包含 Token 用量的分块。"
- en: "How much a reasoning model thinks (GPT-oss, Nova 2). Nova 2 at `high` refuses `max_tokens` and ignores `temperature` and `top_p`."
  zh: "推理模型的思考程度（GPT-oss、Nova 2）。Nova 2 在 `high` 强度下拒绝 `max_tokens`，并忽略 `temperature` 和 `top_p`。"
- en: "Prompt tokens, cached ones included."
  zh: "提示 Token 数，包括缓存的 Token。"
- en: "The model's reasoning, on reasoning models."
  zh: "模型的推理内容，适用于推理模型。"
- en: "Text, or a list of input messages and items, the whole conversation each time."
  zh: "文本，或输入消息和条目的列表，每次都需包含完整对话。"
- en: "A system message."
  zh: "系统消息。"
- en: "The system prompt."
  zh: "系统提示词。"
- en: "Text, or a list of content blocks (`text`, `image`, `tool_use`, `tool_result`)."
  zh: "文本，或内容块列表（`text`、`image`、`tool_use`、`tool_result`）。"
- en: "Extended thinking, on Claude models that support it."
  zh: "扩展思考，适用于支持该功能的 Claude 模型。"
- en: "One text or up to 256. On multimodal models, an item may be an image as a base64 data URL."
  zh: "一条文本，或最多 256 条。在多模态模型上，条目也可以是以 base64 data URL 表示的图像。"
- en: "The vector size, on models that offer a choice (Titan Text Embeddings v2 256, 512 or 1024; Titan Multimodal Embeddings; Cohere Embed v4)."
  zh: "向量维度，适用于可选择维度的模型（Titan Text Embeddings v2 可选 256、512 或 1024；Titan Multimodal Embeddings；Cohere Embed v4）。"
- en: "Floats, or with `encoding_format` `base64` the little-endian float32 bytes in base64."
  zh: "浮点数；若 `encoding_format` 为 `base64`，则为 base64 编码的小端序 float32 字节。"
