    ### 支持 OpenAI 兼容端点的工具

    接受“OpenAI 兼容”提供方的编辑器和聊天应用（例如 Continue、Open WebUI 和 LibreChat）
    需要同样的三个值：基础 URL `https://ai-gateway.example.com/v1`、您的 API 密钥，以及模型 ID。
